name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # every pull request runs, docs-only ones included: the main ruleset
  # requires `ci-ok`, and a check that never reports blocks the merge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: the newest push wins. Every other run keeps its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.ref, github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lowest version the engines field claims to support, plus current LTS.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax check all sources
        run: for f in src/*.js public/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Validate that the Worker bundles, without needing Cloudflare credentials.
      - name: Dry-run deploy
        run: |
          sed 's/REPLACE_WITH_YOUR_D1_ID/00000000-0000-0000-0000-000000000000/' \
            wrangler.toml.example > wrangler.toml
          npx wrangler deploy --dry-run --outdir /tmp/wrangler-build

  # The one check the main ruleset requires. It fails unless every job above
  # succeeded, so adding or renaming a job only needs an edit to `needs` here.
  ci-ok:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
